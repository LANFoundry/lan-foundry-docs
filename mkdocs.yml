site_name: LAN Foundry Docs
site_description: Documentation for locally hosted networking and storage — starting with the Argus NVR. Free for everyone.
site_author: LAN Foundry
# Public URL is lanfoundry.com/docs/, reached via a Cloudflare Worker that
# routes /docs* to this project's own Pages deployment — this repo has no
# knowledge of that routing beyond this URL (used for sitemap.xml and
# canonical link tags; internal nav links are already page-relative).
site_url: https://lanfoundry.com/docs/

# mkdocs serve only live-reloads docs_dir by default — without this, edits
# under overrides/ (custom_dir) require a manual server restart to appear.
watch:
  - overrides

theme:
  name: material
  custom_dir: overrides
  logo: assets/branding/logo-mark.svg
  favicon: assets/branding/favicon.png
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - search.suggest
    - content.code.copy
    # Replaces native title-attribute tooltips (what plain <abbr> relies on)
    # with Material's own tap-friendly version — the browser-native kind
    # has no touch equivalent, so abbreviations (includes/abbreviations.md)
    # were unreachable on mobile without this.
    - content.tooltips

# Overrides the logo/site-title link in the header, which Material otherwise
# points at this docs site's own index page. Clicking the logo should go to
# the main site, not "documentation home" — see nav below for that.
extra:
  homepage: https://lanfoundry.com/

extra_css:
  - stylesheets/brand.css

extra_javascript:
  - javascripts/brand.js

plugins:
  - search
  - glightbox

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  # Acronym glossary: definitions live in includes/abbreviations.md (outside
  # docs_dir, so it's never built as its own page) and get appended to every
  # page at build time. `abbr` (Python-Markdown core, not a pymdownx
  # extension) then wraps any matching term in <abbr title="..."> for a
  # hover/tap tooltip, defined once, applies everywhere automatically.
  - abbr
  - pymdownx.snippets:
      auto_append:
        - includes/abbreviations.md

