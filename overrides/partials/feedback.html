{% if page %}
<div class="lf-feedback">
  <h3 class="lf-feedback__label">Was this page helpful?</h3>

  <p class="lf-feedback__intro">
    Found something wrong or out of date? Let us know below, or
    <a href="https://github.com/lanfoundry/lan-foundry-docs/issues/new?title=Feedback: {{ page.title }}&body=**Page:** {{ page.url }}%0A%0A**Issue:**%0A" target="_blank">open a GitHub issue</a>
    if you have a GitHub account.
  </p>

  <form class="lf-feedback__form" action="https://formspree.io/f/xykabrqe" method="POST">
    <input type="hidden" name="page" value="{{ page.title }}">
    <input type="hidden" name="url" value="{{ page.url }}">

    <div class="lf-feedback__field">
      <label for="lf-issue-type">What type of issue is this?</label>
      <select id="lf-issue-type" name="issue_type" required>
        <option value="" disabled selected>Select a category</option>
        <option value="factually_incorrect">Something is factually incorrect</option>
        <option value="outdated">Information is outdated</option>
        <option value="unclear">Something is unclear or confusing</option>
        <option value="missing">Something important is missing</option>
        <option value="broken">A link or image is broken</option>
        <option value="other">Other</option>
      </select>
    </div>

    <div class="lf-feedback__field">
      <label for="lf-message">Tell us more</label>
      <textarea id="lf-message" name="message" required rows="4" placeholder="Describe the issue as specifically as you can..."></textarea>
    </div>

    <button type="submit" class="lf-feedback__submit">Send feedback</button>
  </form>
</div>
{% endif %}
